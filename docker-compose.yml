services:
  genesis-service:
    build:
      context: ./genesis_service
      dockerfile: Dockerfile
    container_name: atheric_genesis_service
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./BE/data:/app/data
    environment:
      - PORT=8000
      - MARKET_DB_PATH=/app/data/idx_scraped_data.db
      - GENESIS_ENCRYPTION_KEY=${GENESIS_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - atheric-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:8000/health > /dev/null 2>&1 || wget -qO- http://127.0.0.1:8000/health > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: atheric_backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./BE/data:/app/data
    environment:
      - PORT=5000
      - DB_PATH=/app/data/atheric_app.db
      - MARKET_DB_PATH=/app/data/idx_scraped_data.db
      - GENESIS_API_URL=http://genesis-service:8000
      - GENESIS_ENCRYPTION_KEY=${GENESIS_ENCRYPTION_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SYNC_SECRET_KEY=${SYNC_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
    depends_on:
      genesis-service:
        condition: service_healthy
    networks:
      - atheric-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: atheric_frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - atheric-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  atheric-net:
    driver: bridge
