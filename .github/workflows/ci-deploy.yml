name: CI/CD Pipeline & Auto Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Verify Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: BE/go.sum

      - name: Verify Backend (Go) Build
        run: |
          cd BE
          go vet ./...
          go build -v .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json

      - name: Verify Frontend (React/Vite) Build
        run: |
          cd FE
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify Genesis AI Microservice
        run: |
          cd genesis_service
          pip install -r requirements.txt
          python -c "import crypto; import server; print('Genesis Microservice Syntax & Imports OK!')"

  deploy-vps:
    name: Deploy to Production VPS
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR || format('/home/{0}/athericML', secrets.VPS_USER) }}"
            echo "🚀 [1/6] Navigating to project directory: $APP_DIR..."
            if [ ! -d "$APP_DIR" ]; then
              echo "Creating $APP_DIR and cloning repo..."
              git clone https://github.com/mleGIBEItelyu/atheric_docker.git "$APP_DIR"
            fi
            cd "$APP_DIR"

            echo "🔄 [2/6] Synchronizing Git repository with origin/main..."
            git fetch origin main || true
            git reset --hard origin/main || true
            git clean -fd -e .env -e BE/data -e genesis_service/data || true

            echo "📁 [3/6] Ensuring required directories & .env exist..."
            mkdir -p BE/data genesis_service/data
            if [ ! -f .env ] && [ -f .env.example ]; then
              echo "Creating initial .env from template..."
              cp .env.example .env
            fi

            echo "🐳 [4/6] Building images (Zero-Downtime: container lama tetap melayani traffic)..."
            sudo docker compose build

            echo "🚀 [5/6] Switching seamlessly to updated containers..."
            sudo docker compose up -d --remove-orphans

            echo "🔍 [6/6] Verifying live container health..."
            sleep 8
            sudo docker ps
            curl -sI http://localhost:80 | head -n 1 || true
            curl -sI http://localhost:5000/api/health | head -n 1 || true
            curl -sI http://localhost:8000/health | head -n 1 || true

            sudo docker system prune -f || true
            echo "✨ [SUCCESS] Fullstack deployment verified and completed successfully!"
