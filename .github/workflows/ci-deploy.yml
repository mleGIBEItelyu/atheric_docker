name: CI/CD Pipeline & Auto Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Verify Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: BE/go.sum

      - name: Verify Backend (Go) Build
        run: |
          cd BE
          go vet ./...
          go build -v .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json

      - name: Verify Frontend (React/Vite) Build
        run: |
          cd FE
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify Genesis AI Microservice
        run: |
          cd genesis_service
          pip install -r requirements.txt
          python -c "import crypto; import server; print('Genesis Microservice Syntax & Imports OK!')"

  deploy-vps:
    name: Deploy to Production VPS
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              if [ -d "/home/${{ secrets.VPS_USER }}/athericweb" ]; then
                APP_DIR="/home/${{ secrets.VPS_USER }}/athericweb"
              elif [ -d "/root/athericweb" ]; then
                APP_DIR="/root/athericweb"
              else
                APP_DIR="$HOME/athericweb"
              fi
            fi
            echo "🚀 [DEPLOY] Navigating to $APP_DIR..."
            if [ ! -d "$APP_DIR" ]; then
              echo "Repository not found at $APP_DIR, cloning..."
              git clone https://github.com/mleGIBEItelyu/atheric_docker.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            echo "🔄 [GIT] Pulling latest main branch..."
            git pull origin main
            echo "🐳 [DOCKER] Building & running containers..."
            sudo docker compose down || docker compose down || true
            sudo docker compose up -d --build || docker compose up -d --build
            sudo docker system prune -f || docker system prune -f || true
            echo "✅ [SUCCESS] Deployment completed successfully!"
