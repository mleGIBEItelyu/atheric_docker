name: CI/CD Pipeline & Auto Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Verify Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: BE/go.sum

      - name: Verify Backend (Go) Build
        run: |
          cd BE
          go vet ./...
          go build -v .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json

      - name: Verify Frontend (React/Vite) Build
        run: |
          cd FE
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify Genesis AI Microservice
        run: |
          cd genesis_service
          pip install -r requirements.txt
          python -c "import crypto; import server; print('Genesis Microservice Syntax & Imports OK!')"

  deploy-vps:
    name: Deploy to Production VPS
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR || format('/home/{0}/athericML', secrets.VPS_USER) }}"
            echo "🚀 [DEPLOY] Navigating to $APP_DIR..."
            if [ ! -d "$APP_DIR" ]; then
              echo "Creating $APP_DIR and cloning repo..."
              git clone https://github.com/mleGIBEItelyu/atheric_docker.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            echo "🔄 [GIT] Pulling latest main branch..."
            git pull origin main
            sudo docker compose down --remove-orphans || true
            sudo docker compose up -d --build --remove-orphans --force-recreate
            sudo docker system prune -f || true
            echo "✅ [SUCCESS] Deployment completed successfully!"
