services:
  genesis-service-dev:
    build:
      context: ./genesis_service
      dockerfile: Dockerfile
    container_name: atheric_genesis_service_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./genesis_service:/app
      - ./BE/data:/app/data
    environment:
      - PORT=8000
      - MARKET_DB_PATH=/app/data/idx_scraped_data.db
      - GENESIS_ENCRYPTION_KEY=${GENESIS_ENCRYPTION_KEY:-${JWT_SECRET:-atheric_genesis_prod_master_salt_2026}}
      - JWT_SECRET=${JWT_SECRET:-atheric_genesis_prod_master_salt_2026}
    command: uvicorn server:app --reload --host 0.0.0.0 --port 8000
    networks:
      - atheric-dev-net

  backend-dev:
    image: golang:1.22-alpine
    container_name: atheric_backend_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./BE:/app
    ports:
      - "5000:5000"
    env_file:
      - ./BE/.env
    environment:
      - PORT=5000
      - DB_PATH=data/atheric_app.db
      - MARKET_DB_PATH=data/idx_scraped_data.db
      - GENESIS_API_URL=http://genesis-service-dev:8000
      - GENESIS_ENCRYPTION_KEY=${GENESIS_ENCRYPTION_KEY:-${JWT_SECRET:-atheric_genesis_prod_master_salt_2026}}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1
      - JWT_SECRET=${JWT_SECRET:-atheric_ai_super_secret_jwt_key_2026_change_in_prod}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-Atheric AI <onboarding@resend.dev>}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    command: sh -c "go run main.go"
    depends_on:
      - genesis-service-dev
    networks:
      - atheric-dev-net

  frontend-dev:
    image: node:20-alpine
    container_name: atheric_frontend_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./FE:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend-dev
    networks:
      - atheric-dev-net

networks:
  atheric-dev-net:
    driver: bridge
